# Clash 网络加速：cargo 拉取 crates.io 与 git 依赖均走 7897 代理
[http]
proxy = "http://127.0.0.1:7897"

[net]
# 用系统 git 拉取 prisma-client-rust 的 git 依赖（继承 shell 的 http(s)_proxy 环境变量）
git-fetch-with-cli = true

# prisma-client-rust 生成器：在 src-tauri/ 下执行 `cargo prisma <cmd>`，
# 例如 `cargo prisma generate`。生成器在独立成员 crate prisma-cli/ 中，
# 故用 -p 指定，不会污染应用本体的构建/打包。
[alias]
prisma = "run -p prisma-cli --"
